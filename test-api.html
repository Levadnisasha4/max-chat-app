<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест GREEN-API</title>
</head>
<body>
    <h2>Тест API GREEN-API</h2>
    <input type="text" id="idInstance" placeholder="idInstance"><br><br>
    <input type="text" id="apiToken" placeholder="apiTokenInstance"><br><br>
    <input type="text" id="chatId" placeholder="Номер получателя (например, 79991234567@c.us)"><br><br>
    <input type="text" id="message" placeholder="Текст сообщения"><br><br>
    <button onclick="sendMessage()">Отправить сообщение</button>
    <p id="result" style="color:green;"></p>
    <p id="error" style="color:red;"></p>

    <script>
        async function sendMessage() {
            const idInstance = document.getElementById('idInstance').value.trim();
            const apiToken = document.getElementById('apiToken').value.trim();
            const chatId = document.getElementById('chatId').value.trim();
            const message = document.getElementById('message').value.trim();
            
            document.getElementById('result').innerText = '';
            document.getElementById('error').innerText = '';

            if (!idInstance || !apiToken || !chatId || !message) {
                document.getElementById('error').innerText = 'Заполните все поля!';
                return;
            }

            const url = `https://api.green-api.com/v3/waInstance${idInstance}/sendMessage/${apiToken}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: chatId, message: message })
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerText = 'Успешно отправлено! ID сообщения: ' + JSON.stringify(data);
                } else {
                    document.getElementById('error').innerText = 'Ошибка API: ' + JSON.stringify(data);
                }
            } catch (err) {
                document.getElementById('error').innerText = 'Ошибка сети: ' + err.message;
            }
        }
    </script>
</body>
</html>
